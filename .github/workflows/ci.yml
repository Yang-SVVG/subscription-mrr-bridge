name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 单元测试（含 SQL 与 Python 对拍）
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

      - name: 端到端跑一遍（对拍 + 一致性检查）
        run: python scripts/run_bridge.py --out build/sample-report.md
